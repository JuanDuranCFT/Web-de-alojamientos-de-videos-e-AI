<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVI Player - Arica TV</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- VIDEO PRINCIPAL IZQUIERDA (70%) -->
        <main class="player-section">
            <video id="main-player" 
                   autoplay muted loop playsinline 
                   class="main-video">
            </video>
        </main>

        <!-- INFO DERECHA (30%) - FECHA/HORA/CLIMA -->
        <aside class="sidebar">
            <div class="info-panel">
                <!-- FECHA -->
                <div class="fecha-section">
                    <div id="fecha">Lunes, 12 Ene 2026</div>
                </div>
                
                <!-- HORA CENTRAL -->
                <div class="hora-section">
                    <div id="hora" class="hora">12:17</div>
                </div>
                
                <!-- CLIMA -->
                <div class="weather-section">
                    <div class="weather">
                        <span id="clima-icon">☀️</span>
                        <div>
                            <div id="ciudad">Arica, Chile</div>
                            <div id="temperatura">Analizando...</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
